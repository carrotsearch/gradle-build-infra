name: Build and test (reusable workflow)

# Concurrency is set by the calling workflow; manual dispatches should not cancel each other.
on: # zizmor: ignore[concurrency-limits]
  workflow_dispatch:
    inputs:
      gradle-options:
        type: string
        description: "Any extra options to be passed to gradle"
        required: false
        default: ""

      os:
        type: choice
        description: "OS to run on."
        required: true
        options:
          - ubuntu-latest
          - windows-2022

      jdk-version:
        type: string
        required: true
        description: "JDK version to use."
        default: 21

      build-timeout:
        description: "Build timeout, in minutes"
        type: number
        default: 30

  workflow_call:
    inputs:
      gradle-options:
        type: string
        description: "Any extra options to be passed to gradle"
        required: false
        default: ""

      os:
        type: string
        description: "OS to run on."
        required: true
        default: "ubuntu-latest"

      jdk-version:
        type: string
        required: true
        description: "JDK version to use."

      build-timeout:
        description: "Build timeout, in minutes"
        type: number
        default: 30

# The build only reads the repository.
permissions:
  contents: read

jobs:
  build-and-test:
    name: test and assemble (JDK ${{ inputs.jdk-version }} on ${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ fromJSON(inputs.build-timeout) }}
    permissions:
      contents: read

    env:
      CI: true
      # Passed through the environment rather than expanded into the script, see
      # https://docs.zizmor.sh/audits/#template-injection
      GRADLE_OPTIONS: ${{ inputs.gradle-options }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/prepare-gradle-build
        with:
          jdk-version: ${{ inputs.jdk-version }}

      - name: Assemble only
        run: ./gradlew --warning-mode all ${GRADLE_OPTIONS} --max-workers 4 assemble

      - name: Tests and validation
        run: ./gradlew --warning-mode all ${GRADLE_OPTIONS} --max-workers 4 check

      - name: Store failed test outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-outputs
          path: '**/OUTPUT-*.txt'
