name: Build and test (on commits and PRs)

on:
  workflow_dispatch:
    # Allow manual dispatch.

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# The build only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: run checks

    strategy:
      matrix:
        os: [ ubuntu-latest ]
        jdk-version: [ '21', '24' ]

    uses: $/.github/workflows/build-and-test.yml
    with:
      gradle-options:
      os: ${{ matrix.os }}
      jdk-version: ${{ matrix.jdk-version }}
