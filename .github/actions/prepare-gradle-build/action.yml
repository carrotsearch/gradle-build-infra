name: "Prepare Gradle and Java build"
description: "Prepare Gradle and Java build"

inputs:
   jdk-version:
     required: true
     description: "JDK version to set up"

   jdk-distribution:
     required: false
     default: "temurin"
     description: "JDK distribution"

runs:
 using: "composite"
 steps:
   - name: "Set up JDK (${{ inputs.jdk-distribution }}, ${{ inputs.jdk-version }}) [buildjet]"
     if: ${{ contains(runner.name, 'buildjet') }}
     uses: buildjet/setup-java@54606be360d074a587c5ddedf8e13110b36c5860 # v4.2.2
     with:
       distribution: ${{ inputs.jdk-distribution }}
       java-version: ${{ inputs.jdk-version }}
       java-package: jdk

   - name: "Set up JDK (${{ inputs.jdk-distribution }}, ${{ inputs.jdk-version }}) [blacksmith]"
     if: ${{ contains(runner.name, 'blacksmith') }}
     uses: useblacksmith/setup-java@4ef812391eff6e9737ba13bf0356d0f702877a64 # v5.0.1
     with:
       distribution: ${{ inputs.jdk-distribution }}
       java-version: ${{ inputs.jdk-version }}
       java-package: jdk

   - name: "Set up JDK (${{ inputs.jdk-distribution }}, ${{ inputs.jdk-version }}) [github]"
     if: ${{ !contains(runner.name, 'buildjet') && !contains(runner.name, 'blacksmith') }}
     uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
     with:
       distribution: ${{ inputs.jdk-distribution }}
       java-version: ${{ inputs.jdk-version }}
       java-package: jdk

   - name: Setup Gradle [blacksmith]
     if: ${{ contains(runner.name, 'blacksmith') }}
     uses: useblacksmith/setup-gradle/setup-gradle@7f7b3552fe93f9f80c27f6fb113bb11b7c0fa8eb # v7

   - name: Setup Gradle
     if: ${{ !contains(runner.name, 'buildjet') && !contains(runner.name, 'blacksmith') }}
     uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
