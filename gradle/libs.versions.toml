[versions]
projectVersion = "0.0.26"
projectVersionSelfApply = "0.0.25"
minJava = "21"
googleJavaFormat = "1.35.0"

[libraries]
carrotsearch-procfork = "com.carrotsearch:procfork:1.0.6"
buildoptions-plugin = "com.carrotsearch.gradle.opts:com.carrotsearch.gradle.opts.gradle.plugin:0.2.3"
dependencychecks-plugin = "com.carrotsearch.gradle.dependencychecks:com.carrotsearch.gradle.dependencychecks.gradle.plugin:0.2.3"
spotless-plugin = "com.diffplug.spotless:spotless-plugin-gradle:8.10.2"
forbiddenapis-plugin = "de.thetaphi:forbiddenapis:3.10"
benmanes-versions-plugin = "io.github.ben-manes.versions.settings:io.github.ben-manes.versions.settings.gradle.plugin:0.61.0"
version-catalog-update-plugin = "nl.littlerobots.version-catalog-update:nl.littlerobots.version-catalog-update.gradle.plugin:1.1.1"
jackson-databind = "com.fasterxml.jackson.core:jackson-databind:2.22.2"
assertj = "org.assertj:assertj-core:3.27.7"
# A simple http server for tests.
httpcore5 = "org.apache.httpcomponents.core5:httpcore5:5.4.3"
junit-jupiter = "org.junit.jupiter:junit-jupiter:6.1.3"
# The groovy variant must match the groovy version bundled with gradle (testkit tests).
spockframework = "org.spockframework:spock-bom:2.4-groovy-4.0"

[plugins]
buildinfra = { id = "com.carrotsearch.gradle.buildinfra", version.ref = "projectVersionSelfApply" }
pluginpublish = "com.gradle.plugin-publish:2.2.1"
